<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Loader</title>

<style>
body {
    margin: 0;
    background: black;
    overflow: hidden;
}

/* CENTER SCREEN */
#loader {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

/* 3D SCENE */
.scene {
    width: 180px;
    height: 180px;
    perspective: 800px;
}

/* SPINNING SPHERE */
.sphere {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: url("https://i1.sndcdn.com/avatars-dDNxsnFAu6GVU6CM-5ZtiLg-t240x240.jpg");
    background-size: cover;

    animation: spin 2s linear infinite;
    transform-style: preserve-3d;

    box-shadow:
        inset -20px -20px 40px rgba(0,0,0,0.6),
        inset 20px 20px 40px rgba(255,255,255,0.05),
        0 0 40px rgba(255, 180, 80, 0.3);
}

/* REAL 3D ROTATION */
@keyframes spin {
    0% {
        transform: rotateY(0deg) rotateX(10deg);
    }
    100% {
        transform: rotateY(360deg) rotateX(10deg);
    }
}

/* TEXT */
.text {
    margin-top: 25px;
    color: #aaa;
    font-family: Arial;
    letter-spacing: 3px;
    font-size: 14px;
}
</style>
</head>

<body>

<div id="loader">
    <div class="scene">
        <div class="sphere"></div>
    </div>
    <div class="text">LOADING...</div>
</div>

</body>
</html>
