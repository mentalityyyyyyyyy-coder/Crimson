<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRIMSON</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  background: #050505;
  color: #ff003c;
  font-family: 'JetBrains Mono', monospace;
  overflow-x: hidden;
  min-height: 100vh;
}

/* animated grid background */
.bg {
  position: fixed;
  width: 100%;
  height: 100%;
  background:
    linear-gradient(rgba(255,0,60,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,0,60,0.05) 1px, transparent 1px);
  background-size: 40px 40px;
  animation: moveGrid 12s linear infinite;
  z-index: -2;
}

@keyframes moveGrid {
  from { transform: translateY(0); }
  to { transform: translateY(40px); }
}

/* glow overlay */
.glow {
  position: fixed;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at center, rgba(255,0,60,0.15), transparent 70%);
  z-index: -1;
}

/* header */
.header {
  text-align: center;
  margin-top: 8vh;
  padding: 0 20px;
}

/* title */
.title {
  font-size: 60px;
  letter-spacing: 6px;
  position: relative;
  display: inline-block;
}

/* glitch effect */
.title::before,
.title::after {
  content: "CRIMSON";
  position: absolute;
  left: 0;
}

.title::before {
  color: cyan;
  transform: translateX(-2px);
  animation: glitch1 2s infinite;
}

.title::after {
  color: magenta;
  transform: translateX(2px);
  animation: glitch2 2s infinite;
}

@keyframes glitch1 {
  0%,100% { clip-path: inset(0 0 0 0); }
  50% { clip-path: inset(0 0 60% 0); }
}

@keyframes glitch2 {
  0%,100% { clip-path: inset(0 0 0 0); }
  50% { clip-path: inset(60% 0 0 0); }
}

/* subtitle */
.subtitle {
  color: #aaa;
  margin-top: 10px;
  margin-bottom: 20px;
}

/* binary text */
.binary {
  text-align: center;
  color: #ff003c55;
  margin-top: 20px;
  margin-bottom: 30px;
  font-size: 12px;
  padding: 0 20px;
  min-height: 20px;
}

/* search bar */
.search-container {
  text-align: center;
  margin-bottom: 30px;
}

#search {
  width: 50%;
  max-width: 500px;
  background: rgba(0,0,0,0.6);
  border: 1px solid #ff003c;
  color: #ff003c;
  padding: 12px;
  border-radius: 8px;
  outline: none;
  font-family: inherit;
  box-shadow: 0 0 10px #ff003c33;
}

#search::placeholder {
  color: #ff003c88;
}

/* menu */
.menu {
  width: 60%;
  margin: auto;
  padding-bottom: 50px;
}

/* dropdown */
.dropdown {
  border: 1px solid #ff003c;
  margin-bottom: 15px;
  border-radius: 10px;
  overflow: hidden;
  background: rgba(0,0,0,0.6);
  box-shadow: 0 0 15px #ff003c33;
}

/* dropdown header */
.dropdown-header {
  padding: 15px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: 0.2s;
}

.dropdown-header:hover {
  background: rgba(255,0,60,0.1);
}

/* arrow */
.arrow {
  transition: transform 0.3s;
}

/* dropdown content */
.dropdown-content {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease;
  padding: 0 15px;
  color: #aaa;
  line-height: 2;
}

/* active dropdown */
.dropdown.active .dropdown-content {
  max-height: 200px;
  padding-bottom: 15px;
}

.dropdown.active .arrow {
  transform: rotate(180deg);
}

/* tool links */
.tool {
  display: block;
  color: #ff003c;
  text-decoration: none;
  transition: 0.2s;
}

.tool:hover {
  color: white;
  text-shadow: 0 0 10px #ff003c;
}

/* mobile */
@media (max-width: 768px) {

  .title {
    font-size: 38px;
  }

  .menu {
    width: 90%;
  }

  .dropdown-header {
    font-size: 15px;
  }

  .subtitle {
    padding: 0 20px;
  }

  #search {
    width: 85%;
  }

}

</style>
</head>

<body>

<div class="bg"></div>
<div class="glow"></div>

<div class="header">
  <div class="title">CRIMSON</div>
  <div class="subtitle">the tools you ACTUALLY need.</div>
</div>

<div class="binary" id="binary"></div>

<div class="search-container">
  <input type="text" id="search" placeholder="Search tools...">
</div>

<div class="menu">

  <!-- General -->
  <div class="dropdown">
    <div class="dropdown-header">
      <span>General</span>
      <span class="arrow">▼</span>
    </div>

    <div class="dropdown-content">
      <a class="tool" href="#">Scanner</a>
      <a class="tool" href="#">Analyzer</a>
      <a class="tool" href="#">Logs</a>
    </div>
  </div>

  <!-- Games -->
  <div class="dropdown">
    <div class="dropdown-header">
      <span>Games</span>
      <span class="arrow">▼</span>
    </div>

    <div class="dropdown-content">
      <a class="tool" href="#">Mini Games</a>
      <a class="tool" href="#">Sandbox</a>
      <a class="tool" href="#">Challenges</a>
    </div>
  </div>

  <!-- Fun -->
  <div class="dropdown">
    <div class="dropdown-header">
      <span>Fun</span>
      <span class="arrow">▼</span>
    </div>

    <div class="dropdown-content">
      <a class="tool" href="#">Random Generator</a>
      <a class="tool" href="#">Memes</a>
      <a class="tool" href="#">Experiments</a>
    </div>
  </div>

</div>

<script>

/* dropdown toggle */
document.querySelectorAll('.dropdown').forEach(drop => {

  drop.querySelector('.dropdown-header').addEventListener('click', () => {
    drop.classList.toggle('active');
  });

});

/* binary animation */
const bin = document.getElementById("binary");

function randomBinary() {

  let str = "";

  for (let i = 0; i < 50; i++) {
    str += Math.random() > 0.5 ? "1" : "0";
  }

  return str;
}

setInterval(() => {
  bin.textContent = randomBinary();
}, 700);

/* search feature */
const search = document.getElementById("search");

search.addEventListener("input", () => {

  const value = search.value.toLowerCase();

  document.querySelectorAll(".dropdown").forEach(drop => {

    const text = drop.innerText.toLowerCase();

    if (text.includes(value)) {
      drop.style.display = "block";
    } else {
      drop.style.display = "none";
    }

  });

});

</script>

</body>
</html>
