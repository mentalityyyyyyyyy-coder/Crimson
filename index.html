<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KYNODE</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* Loading Screen */
#loader {
    position: fixed;
    inset: 0;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    transition: opacity 1s ease;
}

#loader.fade-out {
    opacity: 0;
    pointer-events: none;
}

#loader h1 {
    font-size: clamp(3rem, 10vw, 8rem);
    letter-spacing: 0.3em;
    font-weight: 800;
    color: white;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from {
        text-shadow: 0 0 10px rgba(255,255,255,0.4);
    }
    to {
        text-shadow:
            0 0 20px rgba(255,255,255,0.8),
            0 0 40px rgba(255,255,255,0.5);
    }
}

/* Main Website */
#content {
    opacity: 0;
    transition: opacity 1.2s ease;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

#content.show {
    opacity: 1;
}

.content-box h2 {
    font-size: 3rem;
    margin-bottom: 1rem;
}

.content-box p {
    color: #aaa;
    font-size: 1.2rem;
}
</style>
</head>
<body>

<div id="loader">
    <h1>KYNODE</h1>
</div>

<div id="content">
    <div class="content-box">
        <h2>Welcome to KYNODE</h2>
        <p>Your website content goes here.</p>
    </div>
</div>

<script>
window.addEventListener("load", () => {
    setTimeout(() => {
        document.getElementById("loader").classList.add("fade-out");
        document.getElementById("content").classList.add("show");

        document.body.style.overflow = "auto";

        setTimeout(() => {
            document.getElementById("loader").remove();
        }, 1000);
    }, 2000); // Loading screen duration (2 seconds)
});
</script>

</body>
</html>
