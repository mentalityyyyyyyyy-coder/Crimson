<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Loading</title>

<style>
body {
    margin: 0;
    background: black;
}

/* LOADER */
#loader {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, #111, black 70%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    transition: opacity 1s ease, transform 1s ease;
}

/* CHIP IMAGE */
.chip {
    width: 160px;
    border-radius: 50%;
    animation: spin 1s linear infinite, float 2s ease-in-out infinite;
    filter: drop-shadow(0 0 25px rgba(255, 200, 120, 0.6));
}

/* TEXT */
.text {
    margin-top: 20px;
    color: #aaa;
    font-family: Arial, sans-serif;
    letter-spacing: 3px;
    font-size: 14px;
}

/* ANIMATIONS */
@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

@keyframes float {
    0%,100% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
}

/* FADE OUT */
#loader.fade {
    opacity: 0;
    transform: scale(1.1);
    pointer-events: none;
}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader">
    <img class="chip" src="https://i1.sndcdn.com/avatars-dDNxsnFAu6GVU6CM-5ZtiLg-t240x240.jpg">
    <div class="text">LOADING...</div>

    <audio id="music" autoplay loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>
</div>

<!-- CONTENT -->
<div id="content" style="color:white; padding:40px;">
    <h1>Welcome</h1>
</div>

<script>
window.addEventListener("load", () => {
    const loader = document.getElementById("loader");
    const music = document.getElementById("music");

    setTimeout(() => {
        loader.classList.add("fade");

        setTimeout(() => {
            music.pause();
            loader.remove();
        }, 1000);

    }, 2500);
});
</script>

</body>
</html>
