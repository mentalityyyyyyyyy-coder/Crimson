<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KYNODE</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

/* LOADER */

#loader{
    position:fixed;
    inset:0;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
    transition:opacity 1.2s ease;
}

#loader.fade-out{
    opacity:0;
    pointer-events:none;
}

.logo-container{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
}

.lightning{
    position:absolute;
    font-size:clamp(8rem,20vw,18rem);
    color:#ffd400;
    transform:rotate(-15deg);
    filter:drop-shadow(0 0 30px #ffd400);
    animation:lightningPulse 2s infinite alternate;
    user-select:none;
}

.logo-text{
    position:relative;
    z-index:2;
    font-family:"Brush Script MT", cursive;
    font-size:clamp(4rem,10vw,8rem);
    font-weight:normal;
    color:white;
    text-shadow:
        0 0 10px rgba(255,255,255,0.9),
        0 0 25px rgba(255,255,255,0.6);
    animation:textFloat 3s ease-in-out infinite;
}

@keyframes lightningPulse{
    from{
        transform:rotate(-15deg) scale(1);
        filter:drop-shadow(0 0 20px #ffd400);
    }
    to{
        transform:rotate(-15deg) scale(1.08);
        filter:drop-shadow(0 0 50px #ffd400);
    }
}

@keyframes textFloat{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-5px);
    }
}

/* MAIN WEBSITE */

#content{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    opacity:0;
    transition:opacity 1.5s ease;
}

#content.show{
    opacity:1;
}

.content-box h2{
    font-size:3rem;
    margin-bottom:1rem;
}

.content-box p{
    color:#aaa;
    font-size:1.2rem;
}
</style>
</head>
<body>

<!-- Loading Screen -->
<div id="loader">
    <div class="logo-container">
        <div class="lightning">⚡</div>
        <div class="logo-text">KYNODE</div>
    </div>
</div>

<!-- Main Website -->
<div id="content">
    <div class="content-box">
        <h2>Welcome to KYNODE</h2>
        <p>Your website content goes here.</p>
    </div>
</div>

<script>
window.addEventListener("load", () => {

    setTimeout(() => {

        document.getElementById("loader").classList.add("fade-out");
        document.getElementById("content").classList.add("show");

        document.body.style.overflow = "auto";

        setTimeout(() => {
            document.getElementById("loader").remove();
        }, 1200);

    }, 2500);

});
</script>

</body>
</html>
