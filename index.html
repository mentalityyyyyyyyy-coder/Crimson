<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Loading</title>

<style>
body {
    margin: 0;
    background: black;
    font-family: Arial, sans-serif;
}

/* LOADER SCREEN */
#loader {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, #111 0%, black 70%);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 9999;
    transition: opacity 1s ease, transform 1s ease;
}

/* SPINNING CHIP */
.chip {
    width: 150px;
    animation: spin 1.2s linear infinite, float 2s ease-in-out infinite;
    filter: drop-shadow(0 0 25px rgba(255, 180, 80, 0.6));
}

/* LOADING TEXT */
.text {
    margin-top: 20px;
    color: #aaa;
    letter-spacing: 3px;
    font-size: 14px;
    opacity: 0.8;
}

/* ANIMATIONS */
@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

@keyframes float {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-10px) rotate(180deg); }
}

/* FADE OUT */
#loader.fade {
    opacity: 0;
    transform: scale(1.1);
    pointer-events: none;
}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader">
    <img src="chip.png" class="chip" alt="chip">
    <div class="text">LOADING...</div>

    <audio id="music" autoplay loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>
</div>

<!-- YOUR WEBSITE CONTENT -->
<div id="content" style="color:white; padding:40px;">
    <h1>Welcome</h1>
</div>

<script>
window.addEventListener("load", () => {
    const loader = document.getElementById("loader");
    const music = document.getElementById("music");

    // minimum show time
    setTimeout(() => {
        loader.classList.add("fade");

        setTimeout(() => {
            music.pause();
            loader.remove();
        }, 1000);

    }, 2500);
});
</script>

</body>
</html>
